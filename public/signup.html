<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Sign Up — TaskFlow</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="auth-page">
        <main class="auth-card">
            <a class="logo" href="/">Task<span>Flow</span></a>
            <h1>Create your account</h1>
            <p>Start organizing your work today.</p>
            <form id="signupForm">
                <label>Full name<input id="name" type="text" required minlength="2" autocomplete="name"></label>
                <label>Email<input id="email" type="email" required autocomplete="email"></label>
                <label>Password<input id="password" type="password" required minlength="6" autocomplete="new-password"></label>
                <button class="btn" type="submit">Create Account</button>
                <p id="message" class="message" role="alert"></p>
            </form>
            <p>Already have an account? <a href="/login.html">Log in</a></p>
        </main>
        <script src="auth.js"></script>
    </body>
    </html>
